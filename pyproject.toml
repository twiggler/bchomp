[project]
name = "bchomp"
version = "0.1.0"
description = "bchomp — a small binary parser-combinator library for Python"
requires-python = ">=3.14"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D105",  # Missing docstring in magic methods
    "D107",  # Missing docstring in `__init__`
    "FIX002",  # TODO comments
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link in TODO
    "COM812", # Conflicts with ruff formatter
    "D203", # Conflicts with D211
    "D213", # Conflicts with D212,
    "UP047",  "UP046" # Some type checkers do not infer covariance
]   

[tool.ruff.lint.per-file-ignores]
"main.py" = ["T201"] # Allow print statements in main.py

[tool.ruff.format]
quote-style = "double"
